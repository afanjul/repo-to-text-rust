[package]
name = "repo-to-text-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.35.1", features = ["full"] }
walkdir = "2.4.0"
clipboard = "0.5.0"
rfd = "0.14.1"
glob = "0.3.1"

[build]
rustflags = ["-A", "warnings"]

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
